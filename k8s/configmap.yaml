apiVersion: v1
kind: ConfigMap
metadata:
  name: document-support-rag-chatbot-config
  labels:
    app.kubernetes.io/name: document-support-rag-chatbot
data:
  APP_NAME: document-support-rag-chatbot
  APP_ENV: kubernetes
  LOG_LEVEL: INFO
  UPLOAD_DIR: /app/data/uploads
  MAX_UPLOAD_SIZE_MB: "10"
  OPENAI_EMBEDDING_MODEL: text-embedding-3-small
  OPENAI_CHAT_MODEL: gpt-5.6-terra
  MAX_RETRIEVAL_DISTANCE: "1.0"
  CHROMA_PERSIST_DIR: /app/data/chroma
  CHROMA_COLLECTION_NAME: support_documents
